name: Automerge
on:
  pull_request:
    types:
      - opened
jobs:
  automerge:
    runs-on: ubuntu-latest
    steps:
      - id: automerge
        name: automerge
        uses: "pascalgn/automerge-action@v0.16.4"
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          MERGE_LABELS: "crowdin"
          # staging only accepts squash merges (branch pipeline); retry for a few minutes
          # while the required "PR rules" check is still running.
          MERGE_METHOD: "squash"
          MERGE_RETRIES: "30"
          MERGE_RETRY_SLEEP: "10000"
